<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beat It Out! - Voice Recognition Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="range"] {
            accent-color: rgb(147 51 234);
        }
        @keyframes pulse-custom {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .animate-pulse-slow {
            animation: pulse-custom 2s infinite;
        }
        .correct-flash {
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.8) !important;
            border-color: #22c55e !important;
        }
        .wrong-flash {
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.8) !important;
            border-color: #ef4444 !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useEffect, useMemo, useRef, useState, useCallback } from "https://esm.sh/react@18.3.1";
        import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";

        // ============================================================
        // 1) 关卡素材池 (Level Map)
        // ============================================================
        const LEVEL_RESOURCES = {
            1: {
                "猫": "https://images.unsplash.com/photo-1529778873920-4da4926a72c2?w=400&q=80",
                "狗": "https://images.unsplash.com/photo-1582456891925-a53965520520?w=400&q=80",
            },
            2: {
                "狐狸": "https://images.unsplash.com/photo-1474511320723-9a536ad7bc1b?w=400&q=80",
                "兔子": "https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?w=400&q=80",
            },
            3: {
                "狮子": "https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=400&q=80",
                "老虎": "https://images.unsplash.com/photo-1503066211613-c17ebc9daef0?w=400&q=80",
            },
            4: {
                "苹果": "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400&q=80",
                "香蕉": "https://images.unsplash.com/photo-1528825876-015889741c1b?w=400&q=80",
            }
        };

        const MAX_LEVEL = Object.keys(LEVEL_RESOURCES).length;

        // ============================================================
        // 2) 音频引擎
        // ============================================================
        class SimpleMusicEngine {
            constructor() {
                this.audioContext = null;
                this.masterGainNode = null;
                this.bgGainNode = null;
                this._bgInterval = null;

                if (typeof window !== "undefined") {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    this.audioContext = new Ctx();
                    this.masterGainNode = this.audioContext.createGain();
                    this.masterGainNode.connect(this.audioContext.destination);
                    this.masterGainNode.gain.value = 0.3;

                    this.bgGainNode = this.audioContext.createGain();
                    // 背景音乐音量：提高一点，保证能听出“每关和弦变化”
                    this.bgGainNode.gain.value = 0.18;
                    this.bgGainNode.connect(this.masterGainNode);
                }
            }

            async ensureRunning() {
                if (!this.audioContext) return;
                if (this.audioContext.state === "suspended") {
                    try { await this.audioContext.resume(); } catch {}
                }
            }

            setVolume(v) { if (this.masterGainNode) this.masterGainNode.gain.value = v; }

            degreeToFreq(degree) {
                const map = {
                    1: 261.63, // C4
                    2: 293.66, // D4
                    3: 329.63, // E4
                    4: 349.23, // F4
                    5: 392.00, // G4
                    6: 440.00, // A4
                    7: 493.88, // B4
                };
                const base = map[degree] ?? 261.63;
                return base * 2; // C5~B5 更容易听出音高
            }

            playBeatDegree(degree = 1) {
                if (!this.audioContext || !this.masterGainNode) return;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                const t0 = this.audioContext.currentTime;
                const dur = 0.22;

                osc.type = "triangle";
                osc.frequency.setValueAtTime(this.degreeToFreq(degree), t0);

                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.linearRampToValueAtTime(0.32, t0 + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(gain);
                gain.connect(this.masterGainNode);

                if (this.bgGainNode) {
                    const bg = this.bgGainNode.gain;
                    bg.cancelScheduledValues(t0);
                    bg.setValueAtTime(bg.value, t0);
                    // duck 但不要鸭太狠，否则“和弦变化”更不明显
                    bg.linearRampToValueAtTime(0.12, t0 + 0.01);
                    bg.linearRampToValueAtTime(0.18, t0 + dur);
                }

                osc.start(t0);
                osc.stop(t0 + dur + 0.01);
            }

            startBackgroundMusic(bpm = 120, patternOverride = null) {
                if (!this.audioContext || !this.masterGainNode) return;
                this.stopBackgroundMusic();
                const beatDuration = (60 / bpm) * 1000;
                const dest = this.bgGainNode ?? this.masterGainNode;

                const playNoteAt = (freq, t0, dur, gainLevel, type = "sine") => {
                    const osc = this.audioContext.createOscillator();
                    const g = this.audioContext.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t0);
                    g.gain.setValueAtTime(0.0001, t0);
                    g.gain.linearRampToValueAtTime(gainLevel, t0 + 0.01);
                    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                    osc.connect(g);
                    g.connect(dest);
                    osc.start(t0);
                    osc.stop(t0 + dur + 0.02);
                };

                const playChordAt = (notes, bass, t0) => {
                    const dur = Math.min(0.5, beatDuration / 1000 * 0.85);
                    if (bass) playNoteAt(bass, t0, dur, 0.08, "sine");
                    for (const f of notes) playNoteAt(f, t0, dur, 0.05, "triangle");
                };

                const playArpeggioAt = (freqs) => {
                    const stepMs = beatDuration / Math.max(1, freqs.length);
                    freqs.forEach((f, i) => {
                        setTimeout(() => {
                            const t0 = this.audioContext.currentTime;
                            playNoteAt(f, t0, 0.28, 0.05, "sine");
                        }, i * stepMs);
                    });
                };

                const playLoop = () => {
                    const defaultChord = { notes: [261.63, 329.63, 392.0, 493.88], bass: 130.81 };
                    if (Array.isArray(patternOverride)) {
                        playArpeggioAt(patternOverride);
                        return;
                    }
                    const chord = patternOverride?.notes ? patternOverride : defaultChord;
                    playChordAt(chord.notes, chord.bass, this.audioContext.currentTime);
                };
                playLoop();
                this._bgInterval = setInterval(playLoop, beatDuration);
            }

            stopBackgroundMusic() {
                if (this._bgInterval) clearInterval(this._bgInterval);
                this._bgInterval = null;
            }
        }

        // ============================================================
        // 3) 子组件
        // ============================================================
        function AnimalCard({ imageUrl, label, isActive, status }) {
            let statusClass = "border-white/20 opacity-80 scale-100";
            if (isActive) statusClass = "border-yellow-400 shadow-[0_0_40px_rgba(250,204,21,0.9)] scale-110 z-10";
            if (status === "correct") statusClass = "correct-flash scale-100 z-10 border-4";
            if (status === "wrong") statusClass = "wrong-flash scale-100 z-10 border-4 opacity-50";

            return React.createElement("div", {
                className: `relative aspect-square rounded-xl overflow-hidden border-4 transition-all duration-200 ${statusClass}`
            },
                React.createElement("img", { src: imageUrl, alt: "card", className: "w-full h-full object-cover" }),
                React.createElement("div", {
                    className: `absolute inset-0 transition-opacity ${isActive ? "opacity-100 bg-yellow-400/20" : "opacity-0"} ${status === 'correct' ? 'bg-green-500/20' : ''}`
                }),
                // 只有正确或错误时显示的微型指示器
                status && React.createElement("div", {
                    className: `absolute top-2 right-2 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${status === 'correct' ? 'bg-green-500' : 'bg-red-500'}`
                }, status === 'correct' ? "✓" : "✗")
            );
        }

        function Modal({ title, children, isOpen }) {
            if (!isOpen) return null;
            return React.createElement("div", {
                className: "fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4"
            },
                React.createElement("div", { className: "bg-white rounded-3xl p-8 max-w-md w-full text-center space-y-6 shadow-2xl" },
                    React.createElement("h2", { className: "text-4xl font-black text-purple-600" }, title),
                    children
                )
            );
        }

        // ============================================================
        // 4) 主程序
        // ============================================================
        function App() {
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentLevel, setCurrentLevel] = useState(1);
            const [currentIndex, setCurrentIndex] = useState(-1);
            const [volume, setVolume] = useState(0.3);
            const [bpm, setBpm] = useState(100); // 语音识别需要一点点反应时间，调慢一点点默认值
            const [showEndModal, setShowEndModal] = useState(false);
            const [cards, setCards] = useState([]);
            const GRID_COLS = 5;
            const GRID_ROWS = 2;
            const CARD_COUNT = GRID_COLS * GRID_ROWS; // 2 * 5 = 10

            // 每关随机一条“有规律的 10 拍旋律”
            const MELODY_PATTERNS = useMemo(() => ([
                [1, 3, 5, 3, 5, 1, 5, 3, 5, 1],
                [2, 4, 6, 4, 6, 2, 4, 6, 4, 2],
                [1, 2, 3, 4, 5, 4, 3, 2, 1, 1],
                [5, 5, 6, 6, 5, 4, 3, 3, 2, 1],
                [1, 5, 6, 5, 4, 3, 2, 3, 4, 5],
                [6, 6, 5, 5, 4, 4, 3, 3, 2, 1],
            ]), []);
            const [melodyIdx, setMelodyIdx] = useState(0);
            const BEAT_DEGREES = MELODY_PATTERNS[melodyIdx] ?? MELODY_PATTERNS[0];

            // 多种“分解和弦”背景：每关随机选一种，且不与上一关重复
            const CHORD_PATTERNS = useMemo(() => ({
                Cmaj7: { notes: [261.63, 329.63, 392.0, 493.88], bass: 130.81 },
                Am7:   { notes: [220.0, 261.63, 329.63, 392.0],  bass: 110.0 },
                Fmaj7: { notes: [174.61, 220.0, 261.63, 329.63], bass: 87.31 },
                G7:    { notes: [196.0, 246.94, 293.66, 349.23], bass: 98.0 },
                Dm:    { notes: [146.83, 174.61, 220.0],         bass: 73.42 },
                Em:    { notes: [164.81, 196.0, 246.94],         bass: 82.41 },
            }), []);
            const CHORD_KEYS = useMemo(() => Object.keys(CHORD_PATTERNS), [CHORD_PATTERNS]);
            const [chordKey, setChordKey] = useState(null);

            // --- 均衡抽样：让 10 张卡片中各个 label 的出现次数尽量接近 ---
            const shuffleInPlace = (arr) => {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            };

            const pickBalancedLabels = (keys, count) => {
                const n = keys.length;
                if (n === 0) return [];

                // 如果种类比卡片数还多：直接无放回抽样（每种最多 1 次）
                if (n >= count) return shuffleInPlace([...keys]).slice(0, count);

                // 否则：每种先分配 base 次，剩余 remainder 次随机分配给不同 key
                const base = Math.floor(count / n);
                const remainder = count % n;

                const labels = [];
                for (const k of keys) {
                    for (let i = 0; i < base; i++) labels.push(k);
                }
                const extraKeys = shuffleInPlace([...keys]).slice(0, remainder);
                for (const k of extraKeys) labels.push(k);

                return shuffleInPlace(labels);
            };

            const [results, setResults] = useState(Array(CARD_COUNT).fill(null)); // null, 'correct', 'wrong'

            const engineRef = useRef(null);
            const timerRef = useRef(null);
            const recognitionRef = useRef(null);
            const currentTranscriptRef = useRef("");

            if (!engineRef.current) engineRef.current = new SimpleMusicEngine();

            // --- 语音识别初始化 ---
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = 'zh-CN';

                    recognition.onresult = (event) => {
                        let interim = "";
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            interim += event.results[i][0].transcript;
                        }
                        currentTranscriptRef.current = interim;
                    };

                    recognition.onerror = (event) => console.error("Speech Recognition Error", event.error);
                    recognitionRef.current = recognition;
                }
            }, []);

            const generateCards = useCallback((level) => {
                const pool = LEVEL_RESOURCES[level] || LEVEL_RESOURCES[1];
                const keys = Object.keys(pool);
                const newCards = [];
                const labels = pickBalancedLabels(keys, CARD_COUNT);
                for (const label of labels) newCards.push({ label, imageUrl: pool[label] });
                setCards(newCards);
                setResults(Array(CARD_COUNT).fill(null));
                setCurrentIndex(-1);
                currentTranscriptRef.current = "";

                // 每关换一个和弦：保证与上一关不同
                setChordKey((prev) => {
                    if (CHORD_KEYS.length === 0) return null;
                    if (CHORD_KEYS.length === 1) return CHORD_KEYS[0];
                    let next = prev;
                    while (next === prev) {
                        next = CHORD_KEYS[Math.floor(Math.random() * CHORD_KEYS.length)];
                    }
                    return next ?? CHORD_KEYS[0];
                });

                // 每关换一条旋律：保证与上一关不同
                setMelodyIdx((prev) => {
                    const n = MELODY_PATTERNS.length;
                    if (n <= 1) return 0;
                    let next = prev;
                    while (next === prev) next = Math.floor(Math.random() * n);
                    return next;
                });
            }, []);

            useEffect(() => { generateCards(1); }, [generateCards]);
            useEffect(() => engineRef.current.setVolume(volume), [volume]);

            // --- 核心逻辑 ---
            useEffect(() => {
                const engine = engineRef.current;
                const rec = recognitionRef.current;

                if (!isPlaying) {
                    engine.stopBackgroundMusic();
                    if (timerRef.current) clearInterval(timerRef.current);
                    if (rec) try { rec.stop(); } catch(e) {}
                    return;
                }

                (async () => {
                    await engine.ensureRunning();
                    const pattern = chordKey ? CHORD_PATTERNS[chordKey] : null;
                    engine.startBackgroundMusic(bpm, pattern);
                    if (rec) try { rec.start(); } catch(e) {}
                    
                    const beatMs = (60 / bpm) * 1000;
                    let localIndex = 0;
                    setCurrentIndex(0);
                    engine.playBeatDegree(BEAT_DEGREES[0] ?? 1);

                    timerRef.current = setInterval(() => {
                        // 1. 判定当前这一拍的结果
                        setResults(prev => {
                            const newRes = [...prev];
                            const target = cards[localIndex].label;
                            const heard = currentTranscriptRef.current;
                            
                            // 简单的包含匹配
                            if (heard.includes(target)) {
                                newRes[localIndex] = 'correct';
                            } else {
                                newRes[localIndex] = 'wrong';
                            }
                            return newRes;
                        });

                        // 2. 清空当前识别缓存，准备下一拍
                        currentTranscriptRef.current = "";

                        // 3. 移动到下一张卡片
                        localIndex++;
                        if (localIndex >= cards.length) {
                            setIsPlaying(false);
                            setShowEndModal(true);
                        } else {
                            setCurrentIndex(localIndex);
                            engine.playBeatDegree(BEAT_DEGREES[localIndex % BEAT_DEGREES.length] ?? 1);
                        }
                    }, beatMs);
                })();

                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                    engine.stopBackgroundMusic();
                    if (rec) try { rec.stop(); } catch(e) {}
                };
            }, [isPlaying, bpm, cards, chordKey, CHORD_PATTERNS, melodyIdx, MELODY_PATTERNS]);

            const correctCount = results.filter(r => r === 'correct').length;
            const accuracy = Math.round((correctCount / cards.length) * 100);

            const handleReplay = () => {
                setShowEndModal(false);
                generateCards(currentLevel);
                setIsPlaying(true);
            };

            const handleNextLevel = () => {
                setShowEndModal(false);
                const next = currentLevel >= MAX_LEVEL ? 1 : currentLevel + 1;
                setCurrentLevel(next);
                generateCards(next);
                setIsPlaying(true);
            };

            return React.createElement("div", {
                className: "min-h-screen bg-neutral-900 text-white p-4 md:p-8 font-sans"
            },
                React.createElement("div", { className: "max-w-6xl mx-auto space-y-8" },
                    React.createElement("div", { className: "flex flex-col md:flex-row justify-between items-center gap-6" },
                        React.createElement("div", null,
                            React.createElement("h1", { className: "text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-blue-500" }, "VOICE BEAT!"),
                            React.createElement("div", { className: "flex items-center gap-2 mt-2" },
                                React.createElement("span", { className: "px-3 py-1 bg-blue-600 rounded-full text-xs font-bold" }, `LEVEL ${currentLevel}`),
                                React.createElement("span", { className: "px-3 py-1 bg-white/10 rounded-full text-xs font-bold" }, `CHORD ${chordKey ?? "-"}`),
                                React.createElement("p", { className: "text-neutral-400" }, "激活时读出单词，读对变绿，读错变红")
                            )
                        ),
                        React.createElement("div", { className: "flex flex-wrap items-center gap-4 bg-white/5 p-4 rounded-2xl backdrop-blur-sm border border-white/10" },
                            React.createElement("button", {
                                onClick: () => setIsPlaying(!isPlaying),
                                className: `px-8 py-3 rounded-xl font-bold transition-all ${
                                    isPlaying ? "bg-red-500 hover:bg-red-600" : "bg-blue-600 hover:bg-blue-700"
                                }`
                            }, isPlaying ? "暂停" : "授权并开始"),
                            
                            React.createElement("div", { className: "flex items-center gap-4 border-l border-white/10 pl-4" },
                                React.createElement("div", { className: "w-32" },
                                    React.createElement("label", { className: "block text-[10px] uppercase text-neutral-500 mb-1" }, `BPM (节奏): ${bpm}`),
                                    React.createElement("input", {
                                        type: "range", min: 60, max: 140, step: 10, value: bpm,
                                        onChange: e => setBpm(parseInt(e.target.value)),
                                        disabled: isPlaying,
                                        className: "w-full cursor-pointer disabled:opacity-30"
                                    })
                                ),
                                React.createElement("div", { className: "w-24" },
                                    React.createElement("label", { className: "block text-[10px] uppercase text-neutral-500 mb-1" }, `音量: ${Math.round(volume*100)}%`),
                                    React.createElement("input", {
                                        type: "range", min: 0, max: 1, step: 0.1, value: volume,
                                        onChange: e => setVolume(parseFloat(e.target.value)),
                                        className: "w-full cursor-pointer"
                                    })
                                )
                            )
                        )
                    ),

                    // 网格
                    React.createElement("div", { className: "grid grid-cols-5 grid-rows-2 gap-4" },
                        cards.map((card, i) => React.createElement(AnimalCard, {
                            key: `${currentLevel}-${i}`,
                            imageUrl: card.imageUrl,
                            label: card.label,
                            isActive: currentIndex === i,
                            status: results[i]
                        }))
                    ),

                    // 进度条
                    React.createElement("div", { className: "relative w-full h-4 bg-white/10 rounded-full overflow-hidden" },
                        React.createElement("div", {
                            className: "h-full bg-gradient-to-r from-green-500 to-blue-500 transition-all duration-300",
                            style: { width: `${((currentIndex + 1) / cards.length) * 100}%` }
                        }),
                        // 正在听的指示器
                        isPlaying && React.createElement("div", {
                            className: "absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white/50"
                        }, "Listening...")
                    )
                ),

                // 结果弹窗
                React.createElement(Modal, {
                    title: accuracy > 80 ? "🌟 节奏大师!" : "💪 继续加油!",
                    isOpen: showEndModal
                },
                    React.createElement("div", { className: "space-y-2" },
                        React.createElement("div", { className: "text-6xl font-black text-blue-600" }, `${accuracy}%`),
                        React.createElement("p", { className: "text-neutral-500" }, `正确命中: ${correctCount} / ${cards.length}`)
                    ),
                    React.createElement("div", { className: "flex flex-col gap-3" },
                        React.createElement("button", {
                            onClick: handleNextLevel,
                            className: "w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-xl hover:bg-blue-700 shadow-lg"
                        }, "挑战下一关"),
                        React.createElement("button", {
                            onClick: handleReplay,
                            className: "w-full py-3 bg-neutral-100 text-neutral-500 rounded-2xl font-bold hover:bg-neutral-200"
                        }, "重新挑战本关")
                    )
                )
            );
        }

        createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
</body>
</html>
