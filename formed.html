<!doctype html>
<html lang="zh-CN">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Music Game Card Lighting</title>

    <!-- Tailwind (CDN). 这里保留为“可读/可改”的方式；不走构建。 -->
    <script src="https://cdn.tailwindcss.com"></script>

      <style>
      /* 让 range 更好看一点（可读版本，尽量少魔法） */
      input[type="range"] {
        accent-color: rgb(147 51 234); /* purple-600 */
      }
</style>
    </head>

    <body>
      <div id="root"></div>

    <script type="module">
      // 如果页面打开后“啥也没有”，通常是模块加载失败或浏览器不支持 importmap。
      // 这里做一个错误覆盖层：任何运行时/模块错误都会直接显示出来。
      const showError = (label, err) => {
        const pre = document.createElement("pre");
        pre.style.whiteSpace = "pre-wrap";
        pre.style.fontFamily = "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";
        pre.style.padding = "16px";
        pre.style.margin = "16px";
        pre.style.borderRadius = "12px";
        pre.style.background = "rgba(0,0,0,0.75)";
        pre.style.color = "white";
        pre.textContent = `${label}\n\n${String(err?.stack || err)}`;
        document.body.prepend(pre);
      };

      window.addEventListener("error", (e) => showError("window.error", e.error || e.message));
      window.addEventListener("unhandledrejection", (e) =>
        showError("unhandledrejection", e.reason)
      );

      // 直接用 URL 导入（不依赖 importmap，兼容性更好）
      import React, { useEffect, useMemo, useRef, useState } from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";

      // 内联 SVG 图标：避免第三方图标库在 esm.sh 下引入“第二份 React”导致报错 (#31)
      function Icon({ children, className, viewBox = "0 0 24 24" }) {
        return React.createElement(
          "svg",
          {
            viewBox,
            fill: "none",
            stroke: "currentColor",
            strokeWidth: 2,
            strokeLinecap: "round",
            strokeLinejoin: "round",
            className,
            "aria-hidden": "true",
          },
          children
        );
      }

      function Music2Icon({ className }) {
        return Icon({
          className,
          children: [
            React.createElement("path", { key: 1, d: "M9 18V5l12-2v13" }),
            React.createElement("circle", { key: 2, cx: 7, cy: 18, r: 3 }),
            React.createElement("circle", { key: 3, cx: 19, cy: 16, r: 3 }),
          ],
        });
      }

      function PlayIcon({ className }) {
        return Icon({
          className,
          children: React.createElement("path", { d: "M8 5v14l11-7z" }),
        });
      }

      function PauseIcon({ className }) {
        return Icon({
          className,
          children: [
            React.createElement("path", { key: 1, d: "M7 4h4v16H7z" }),
            React.createElement("path", { key: 2, d: "M13 4h4v16h-4z" }),
          ],
        });
      }

      function RotateCcwIcon({ className }) {
        return Icon({
          className,
          children: [
            React.createElement("path", { key: 1, d: "M3 12a9 9 0 1 0 3-6.7" }),
            React.createElement("path", { key: 2, d: "M3 3v5h5" }),
          ],
        });
      }

      // ============================================================
      // 1) 音频引擎：对齐 src/app/components/SimpleMusicEngine.tsx
      //    - playBeat(): 800Hz “滴答”
      //    - startBackgroundMusic(bpm): 循环播放简单和弦 (C-E-G-E)
      // ============================================================
      class SimpleMusicEngine {
        constructor() {
          this.audioContext = null;
          this.masterGainNode = null;
          this._bgInterval = null;

          if (typeof window !== "undefined") {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            this.audioContext = new Ctx();
            this.masterGainNode = this.audioContext.createGain();
            this.masterGainNode.connect(this.audioContext.destination);
            this.masterGainNode.gain.value = 0.3;
          }
        }

        async ensureRunning() {
          if (!this.audioContext) return;
          // 许多浏览器要求用户手势后才允许播放声音
          if (this.audioContext.state === "suspended") {
            try {
              await this.audioContext.resume();
            } catch {
              // ignore
            }
          }
        }

        setVolume(volume) {
          if (this.masterGainNode) {
            this.masterGainNode.gain.value = volume;
          }
        }

        playBeat() {
          if (!this.audioContext || !this.masterGainNode) return;

          const oscillator = this.audioContext.createOscillator();
          const gainNode = this.audioContext.createGain();

          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(800, this.audioContext.currentTime);

          gainNode.gain.setValueAtTime(0.5, this.audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            this.audioContext.currentTime + 0.1
          );

          oscillator.connect(gainNode);
          gainNode.connect(this.masterGainNode);

          oscillator.start(this.audioContext.currentTime);
          oscillator.stop(this.audioContext.currentTime + 0.1);
        }

        playNote(frequency) {
          if (!this.audioContext || !this.masterGainNode) return;

          const oscillator = this.audioContext.createOscillator();
          const gainNode = this.audioContext.createGain();

          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);

          gainNode.gain.setValueAtTime(0.1, this.audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            this.audioContext.currentTime + 0.3
          );

          oscillator.connect(gainNode);
          gainNode.connect(this.masterGainNode);

          oscillator.start(this.audioContext.currentTime);
          oscillator.stop(this.audioContext.currentTime + 0.3);
        }

        startBackgroundMusic(bpm = 120) {
          if (!this.audioContext || !this.masterGainNode) return null;

          // Stop previous loop if any
          if (this._bgInterval) {
            clearInterval(this._bgInterval);
            this._bgInterval = null;
          }

          const beatDuration = (60 / bpm) * 1000;
          const noteDuration = beatDuration / 4;

          const notes = [
            { freq: 261.63, time: 0 }, // C4
            { freq: 329.63, time: noteDuration }, // E4
            { freq: 392.0, time: noteDuration * 2 }, // G4
            { freq: 329.63, time: noteDuration * 3 }, // E4
          ];

          const playLoop = () => {
            for (const note of notes) {
              setTimeout(() => this.playNote(note.freq), note.time);
            }
          };

          playLoop();
          this._bgInterval = setInterval(playLoop, beatDuration);
          return this._bgInterval;
        }

        stopBackgroundMusic() {
          if (this._bgInterval) {
            clearInterval(this._bgInterval);
            this._bgInterval = null;
          }
        }
      }

      // ============================================================
      // 2) 卡片组件：对齐 src/app/components/AnimalCard.tsx 的视觉效果
      // ============================================================
      function AnimalCard({ imageUrl, type, isActive }) {
        return React.createElement(
          "div",
          {
            className:
              "relative aspect-square rounded-lg overflow-hidden border-4 transition-all duration-200 " +
              (isActive
                ? "border-yellow-400 shadow-[0_0_30px_rgba(250,204,21,0.8)] scale-110"
                : "border-gray-300"),
          },
          React.createElement("img", {
            src: imageUrl,
            alt: type,
            className: "w-full h-full object-cover",
          }),
          React.createElement("div", {
            className:
              "absolute inset-0 transition-all " +
              (isActive ? "bg-yellow-400/30 backdrop-blur-[1px]" : "bg-black/0"),
          })
        );
      }

      // ============================================================
      // 3) 主应用：对齐 src/app/App.tsx 的交互/节拍逻辑/文案
      // ============================================================
      const CAT_IMAGES = [
        "https://images.unsplash.com/photo-1529778873920-4da4926a72c2?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxjdXRlJTIwY2F0fGVufDF8fHx8MTc2NjQ0NTE2N3ww&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",
        "https://images.unsplash.com/photo-1560114928-40f1f1eb26a0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxraXR0ZW58ZW58MXx8fHwxNzY2NTAyOTExfDA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",
        "https://images.unsplash.com/photo-1647806422508-0322f33e270b?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxjYXQlMjBwb3J0cmFpdHxlbnwxfHx8fDE3NjY0MjMyNDN8MA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",
        "https://images.unsplash.com/photo-1593483316242-efb5420596ca?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxvcmFuZ2UlMjBjYXR8ZW58MXx8fHwxNzY2NDgwOTY0fDA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",
      ];

      const DOG_IMAGES = [
        "https://images.unsplash.com/photo-1582456891925-a53965520520?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxjdXRlJTIwZG9nfGVufDF8fHx8MTc2NjQ2NzY4MXww&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",
        "https://images.unsplash.com/photo-1601979031925-424e53b6caaa?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxwdXBweXxlbnwxfHx8fDE3NjY1MDI5MTF8MA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",
        "https://images.unsplash.com/photo-1558788353-f76d92427f16?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxkb2clMjBwb3J0cmFpdHxlbnwxfHx8fDE3NjY0MTUzNjV8MA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",
        "https://images.unsplash.com/photo-1633722715463-d30f4f325e24?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxnb2xkZW4lMjByZXRyaWV2ZXJ8ZW58MXx8fHwxNzY2NDM4OTMxfDA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",
      ];

      function App() {
        const [isPlaying, setIsPlaying] = useState(false);
        const [currentIndex, setCurrentIndex] = useState(-1);
        const [volume, setVolume] = useState(0.3);
        const [bpm, setBpm] = useState(120);

        const musicEngineRef = useRef(null);
        const beatTimerRef = useRef(null);

        if (!musicEngineRef.current) {
          musicEngineRef.current = new SimpleMusicEngine();
        }

        // 只生成一次 16 张卡
        const animalCards = useMemo(() => {
          const cards = [];
          for (let i = 0; i < 16; i++) {
            const isCat = Math.random() > 0.5;
            const pool = isCat ? CAT_IMAGES : DOG_IMAGES;
            const imageUrl = pool[Math.floor(Math.random() * pool.length)];
            cards.push({ type: isCat ? "cat" : "dog", imageUrl });
          }
          return cards;
        }, []);

        useEffect(() => {
          const engine = musicEngineRef.current;
          if (!engine) return;

          engine.setVolume(volume);
        }, [volume]);

        useEffect(() => {
          const engine = musicEngineRef.current;
          if (!engine) return;

          // stop
          if (!isPlaying) {
            setCurrentIndex(-1);

            if (beatTimerRef.current) {
              clearInterval(beatTimerRef.current);
              beatTimerRef.current = null;
            }
            engine.stopBackgroundMusic();
            return;
          }

          // start
          (async () => {
            await engine.ensureRunning();
            engine.startBackgroundMusic(bpm);
            setCurrentIndex(0);

            const beatInterval = (60 / bpm) * 1000;
            beatTimerRef.current = setInterval(() => {
              setCurrentIndex((prev) => {
                const next = prev + 1;
                return next >= animalCards.length ? 0 : next;
              });
              engine.playBeat();
            }, beatInterval);
          })();

          return () => {
            if (beatTimerRef.current) {
              clearInterval(beatTimerRef.current);
              beatTimerRef.current = null;
            }
            engine.stopBackgroundMusic();
          };
        }, [isPlaying, bpm, animalCards.length]);

        const handleReset = () => {
          setIsPlaying(false);
          setCurrentIndex(-1);
        };

        return React.createElement(
          "div",
          { className: "min-h-screen bg-gradient-to-br from-pink-300 via-purple-300 to-indigo-400 p-8" },
          React.createElement(
            "div",
            { className: "max-w-7xl mx-auto space-y-8" },

            // Header
            React.createElement(
              "div",
              { className: "text-center space-y-4" },
              React.createElement(
                "div",
                { className: "flex items-center justify-center gap-3" },
                React.createElement(Music2Icon, { className: "w-12 h-12 text-white" }),
                React.createElement("h1", { className: "text-white text-5xl" }, "Beat It Out!"),
                React.createElement(Music2Icon, { className: "w-12 h-12 text-white" })
              ),
              React.createElement(
                "p",
                { className: "text-white text-xl" },
                "Say it aloud when the picture is lighted!"
              )
            ),

            // Controls
            React.createElement(
              "div",
              { className: "bg-white/20 backdrop-blur-lg rounded-2xl p-6 shadow-2xl" },
              React.createElement(
                "div",
                { className: "flex items-center justify-between flex-wrap gap-4" },
                React.createElement(
                  "div",
                  { className: "flex items-center gap-4" },
                  React.createElement(
                    "button",
                    {
                      onClick: () => setIsPlaying((v) => !v),
                      className:
                        "inline-flex items-center justify-center rounded-md text-lg px-8 py-4 text-white " +
                        "bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700",
                    },
                    isPlaying
                      ? React.createElement(
                          React.Fragment,
                          null,
                          React.createElement(PauseIcon, { className: "w-6 h-6 mr-2" }),
                          "暂停"
                        )
                      : React.createElement(
                          React.Fragment,
                          null,
                          React.createElement(PlayIcon, { className: "w-6 h-6 mr-2" }),
                          "播放"
                        )
                  ),
                  React.createElement(
                    "button",
                    {
                      onClick: handleReset,
                      className:
                        "inline-flex items-center justify-center rounded-md text-lg px-8 py-4 bg-white/50 hover:bg-white/70",
                    },
                    React.createElement(RotateCcwIcon, { className: "w-6 h-6 mr-2" }),
                    "重置"
                  )
                ),

                // Sliders
                React.createElement(
                  "div",
                  { className: "flex items-center gap-4 flex-1 max-w-md" },
                  React.createElement(
                    "div",
                    { className: "flex-1" },
                    React.createElement(
                      "label",
                      { className: "text-white mb-2 block" },
                      `BPM: ${bpm} (${Math.round((60 / bpm) * 1000)}ms/beat)`
                    ),
                    React.createElement("input", {
                      type: "range",
                      min: 60,
                      max: 240,
                      step: 10,
                      value: bpm,
                      disabled: isPlaying,
                      onChange: (e) => setBpm(parseInt(e.target.value, 10)),
                      className: "w-full disabled:opacity-50",
                    })
                  ),
                  React.createElement(
                    "div",
                    { className: "flex-1" },
                    React.createElement(
                      "label",
                      { className: "text-white mb-2 block" },
                      `音量: ${Math.round(volume * 100)}%`
                    ),
                    React.createElement("input", {
                      type: "range",
                      min: 0,
                      max: 1,
                      step: 0.01,
                      value: volume,
                      onChange: (e) => setVolume(parseFloat(e.target.value)),
                      className: "w-full",
                    })
                  )
                )
              ),

              React.createElement(
                "div",
                { className: "mt-4 text-white text-center" },
                isPlaying &&
                  React.createElement(
                    "p",
                    { className: "text-lg" },
                    `正在播放: ${currentIndex + 1} / ${animalCards.length}`
                  )
              )
            ),

            // Grid: 2 rows x 8 columns
            React.createElement(
              "div",
              { className: "bg-white/10 backdrop-blur-sm rounded-2xl p-8" },
              React.createElement(
                "div",
                { className: "grid grid-cols-8 grid-rows-2 gap-4" },
                animalCards.map((card, idx) =>
                  React.createElement(AnimalCard, {
                    key: idx,
                    imageUrl: card.imageUrl,
                    type: card.type,
                    isActive: currentIndex === idx,
                  })
                )
              )
            ),

            // Instructions
            React.createElement(
              "div",
              { className: "bg-white/20 backdrop-blur-lg rounded-2xl p-6 text-white" },
              React.createElement("h3", { className: "text-xl mb-3" }, "使用说明："),
              React.createElement(
                "ul",
                { className: "space-y-2 text-lg" },
                React.createElement("li", null, "• 调整 ", React.createElement("strong", null, "BPM"), " 滑动条来改变节奏速度（60-240，默认120 BPM = 0.5秒/次）"),
                React.createElement("li", null, "• 点击 ", React.createElement("strong", null, "播放"), " 按钮开始游戏"),
                React.createElement("li", null, "• 每个节拍会 ", React.createElement("strong", null, "按顺序"), " 点亮下一张卡片（从左到右，从上到下）"),
                React.createElement("li", null, "• 每张卡片随机显示 ", React.createElement("strong", null, "猫咪 🐱(say CAT!)"), " 或 ", React.createElement("strong", null, "狗狗 🐶(say DOG!)"), " 的图片"),
                React.createElement("li", null, "• 播放完16张卡片后会自动循环"),
                React.createElement("li", null, "• 可随时调整音量或点击 ", React.createElement("strong", null, "重置"), " 重新开始"),
                React.createElement("li", null, "• ", React.createElement("strong", null, "注意："), " BPM 只能在停止状态下调整")
              )
            )
          )
        );
      }

      createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
    </body>
  </html>
